[package]
name = "reclaim"
version = "0.1.0"
edition = "2024"
description = "Frees disk space on APFS by cloning identical files and transparently compressing the rest"
repository = "https://github.com/jonashaag/reclaim"
homepage = "https://github.com/jonashaag/reclaim"

[dependencies]
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.191"
rayon = "1.12.0"

[profile.release]
lto = true
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
